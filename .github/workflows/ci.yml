name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/api
      - run: npm run typecheck --workspace=apps/api
      - run: npm run build --workspace=apps/api
      - run: npm test --workspace=apps/api

  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck --workspace=apps/web
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "https://api.placeholder.invalid"
        run: npm run build --workspace=apps/web
